name: ghcr

# Fork build: publishes ghcr.io/<owner>/scanservjs for the mobile-ui branch.
# Tag a commit `v<upstream>-mobile.<n>` (e.g. v3.3.0-mobile.1) to publish that version.
on:
  workflow_dispatch:
  push:
    branches: [mobile-ui]
    tags: ['v*-mobile.*']

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/scanservjs
          tags: |
            type=match,pattern=v(.*),group=1
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # The Dockerfile's last stage is brscan4, so the target must be explicit
          target: scanservjs-core
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
